<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>IceLink | Chatroom</title>

    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/chatrooms.css">
</head>

<body>
    <!-- NAVBAR -->
    <header class="navbar full-width">
        <div class="nav-container">
            <div class="nav-left">
                <img src="images/IceLink_logo.png" style="height: 60px;">
            </div>
            
            <div class="nav-right">
                <a href="index.html"><img src="images/home.png"></a>
                <a href="games.html"><img src="images/games.png"></a>
                <a href="chat-rooms.html"><img src="images/chatroom.png"></a>
                <a href="login.html"><img src="images/login.png"></a>
            </div>
        </div>
    </header>

    <!-- CHAT PAGE -->
    <div class="chat-page">

        <!-- MAIN CONTAINER -->
        <div class="chat-wrapper">
            <div class="chat-container">
                
                <!-- LEFT: CHANNELS -->
                <div class="chat-sidebar">
                    <h4>Public</h4>
                    <div class="channel active">🌐 General</div>
                    <div class="channel">❄️ Icebreakers</div>
                    <h4>Your Groups</h4>
                    <div class="channel">👥 Study Team</div>
                    <div class="channel">👥 Project Group</div>
                </div>
            
                <!-- CENTER: CHAT -->
                <div class="chat-main">
                    <div class="chat-header">🌐 General</div>
                    <div class="chat-messages">
                        <div class="message"><strong>Alex:</strong> Hello everyone 👋</div>
                        <div class="message"><strong>Jamie:</strong> Anyone done the quiz yet?</div>
                    </div>
                
                    <div class="chat-input">
                        <input type="text" placeholder="Message #general">
                        <button>Send</button>
                    </div>
                </div>

                <!-- RIGHT: ONLINE -->
                <div class="chat-users">
                    <h4>Online</h4>
                    <div class="user online">● Alex</div>
                    <div class="user online">● Jamie</div>
                    <div class="user offline">● Chris</div>
                </div>
            </div>
        </div>
    </div>

    <!-- FOOTER -->
    <footer class="footer">
        <p class="footer-title">IceLink</p>
        <p class="footer-copy">© 2026 IceLink Inc. All rights reserved.</p>
    </footer>
</body>
</html>
