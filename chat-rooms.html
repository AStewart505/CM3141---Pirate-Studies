<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>IceLink | Chatroom</title>

    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/chatrooms.css">
</head>

<body>

<header class="navbar full-width">
    <div class="nav-container">
        <div class="nav-left">
            <img src="images/IceLink_logo.png" style="height: 60px;">
        </div>
        <div class="nav-right">
            <a href="index.html"><img src="images/home.png"></a>
            <a href="games.html"><img src="images/games.png"></a>
            <a href="chat-rooms.html"><img src="images/chatroom.png"></a>
            <a id="nav-auth-link" href="login.html">
                <img id="nav-auth-img" src="images/login.png" style="height: 60px;" alt="Login">
            </a>
        </div>
    </div>
</header>

<div class="page-wrapper">
    <div class="side-bg"></div>

    <div class="content-area">

        <video autoplay muted loop playsinline class="bg-video">
            <source src="videos/Icelink_background.mp4" type="video/mp4">
        </video>

        <div class="video-overlay"></div>

        <div class="page-content">

            <div class="chat-wrapper">

                <!-- SIDEBAR -->
                <div class="chat-sidebar">
                    <h4>Public</h4>

                    <div class="channel active">
                        🌐 General <span class="unread-badge">3</span>
                    </div>

                    <div class="channel">❄️ Icebreakers</div>

                    <h4>Your Groups</h4>

                    <div class="channel">👥 Study Team</div>
                    <div class="channel">👥 Project Group</div>
                </div>

                <!-- CHAT -->
                <div class="chat-main">

                    <div class="chat-header">🌐 General</div>

                    <div class="chat-messages">
                        <div class="message">
                            <strong>Alex:</strong> <span>Hello everyone 👋</span>
                        </div>

                        <div class="message">
                            <strong>Jamie:</strong> <span>Anyone done the quiz yet?</span>
                        </div>
                    </div>

                    <div class="chat-input">
                        <input type="text" placeholder="Message #general">
                        <button>Send</button>
                    </div>

                </div>

                <!-- USERS -->
                <div class="chat-users">
                    <h4>Online</h4>
                    <div class="user online">● Alex</div>
                    <div class="user online">● Jamie</div>
                </div>

            </div>

        </div>
    </div>

    <div class="side-bg"></div>
</div>

<footer class="footer">
    <p class="footer-title">IceLink</p>
    <p class="footer-copy">© 2026 IceLink Inc.</p>
</footer>

<div id="auth-overlay">
  <div class="auth-card">
    <h2>Access Restricted ❄️</h2>
    <p>You must be logged in to access the chatroom.</p>

    <a href="login.html" class="auth-img-btn">
      <img src="images/login.png" alt="Login">
    </a>
  </div>
</div>

<!-- NAVBAR AUTH SCRIPT -->
<script type="module">
import { auth } from "./js/firebase.js";
import { onAuthStateChanged } 
from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

const navImg = document.getElementById("nav-auth-img");
const navLink = document.getElementById("nav-auth-link");

onAuthStateChanged(auth, (user) => {
  if (user) {
    navImg.src = "images/userProfile.png";
    navImg.alt = "Profile";
    navLink.href = "user-profile.html";
  } else {
    navImg.src = "images/login.png";
    navImg.alt = "Login";
    navLink.href = "login.html";
  }
});
</script>

<script type="module">
import { auth } from "./js/firebase.js";
import { onAuthStateChanged } 
from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

const overlay = document.getElementById("auth-overlay");
const pageWrapper = document.querySelector(".page-wrapper");

onAuthStateChanged(auth, (user) => {
  if (!user) {
    pageWrapper.classList.add("blurred");
    overlay.style.display = "flex";
  }
});
</script>

<!-- CHAT SCRIPT -->
<script type="module">
import { auth, db } from "./js/firebase.js";
import { ref, push, onChildAdded } 
from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

const input = document.querySelector(".chat-input input");
const button = document.querySelector(".chat-input button");
const messages = document.querySelector(".chat-messages");

const messagesRef = ref(db, "messages");

function sendMessage() {
    const text = input.value.trim();
    if (!text) return;

    const user = auth.currentUser;
    const username = localStorage.getItem("username") || user?.email || "User";

    push(messagesRef, {
        user: username,
        text: text,
        timestamp: Date.now()
    });

    input.value = "";
}

button.addEventListener("click", sendMessage);

input.addEventListener("keypress", (e) => {
    if (e.key === "Enter") sendMessage();
});

onChildAdded(messagesRef, (snapshot) => {
    const msg = snapshot.val();

    const msgEl = document.createElement("div");
    msgEl.classList.add("message");

    msgEl.innerHTML = `
        <strong style="color:white;">${msg.user}:</strong>
        <span style="color:#7dd3fc;"> ${msg.text}</span>
    `;

    messages.appendChild(msgEl);
    messages.scrollTop = messages.scrollHeight;
});
</script>

</body>
</html>
