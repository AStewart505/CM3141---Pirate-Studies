<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>IceLink</title>
        <link rel="stylesheet" href="css/styles.css">
        <link rel="stylesheet" href="css/escape-room.css">

        
    </head>
    
    <body>
        
        <!-- NAVBAR -->
        <header class="navbar full-width"> 
            <div class="nav-container">
                <div class="nav-left">
                    <img src="images/IceLink_logo.png" style="height: 60px;">
                </div>

                <div class="nav-right">
                    <a href="index.html"><img src="images/home.png" style="height: 60px;"></a>
                    <a href="games.html"><img src="images/games.png" style="height: 60px;"></a>
                    <a href="chat-rooms.html"><img src="images/chatroom.png" style="height: 60px;"></a>
                    <a id="nav-auth-link" href="login.html">
                        <img id="nav-auth-img" src="images/login.png" style="height: 60px;" alt="Login">
                    </a>
                </div>
            </div>
        </header>

        <div class="page-wrapper">
            <!-- LEFT SIDE -->
            <div class="side-bg"></div>

            <!-- CENTER CONTENT -->
            <div class="content-area">

                <!-- VIDEO BACKGROUND -->
                <video autoplay muted loop playsinline poster="images/video_fallback_image.png" class="bg-video">
                    <source src="videos/Icelink_background.mp4" type="video/mp4">
                </video>

                <!-- OVERLAY -->
                <div class="video-overlay"></div>

                <!-- ALL CONTENT -->
                <div class="page-content">
                    <section class="games-header">
                        <h1>🎮 Escape Room</h1>
                        <p>Explore and find your way out</p>
                    </section>
                </div>

                <div class="page-content">
                        <div id="unity-container" class="unity-desktop">
                            <canvas id="unity-canvas" width=960 height=600 tabindex="-1"></canvas>
                             <div id="unity-loading-bar">
                                <div id="unity-logo"></div>
                                <div id="unity-progress-bar-empty">
                                <div id="unity-progress-bar-full"></div>
                            </div>
                        </div>
                        <div id="unity-warning"> </div>
                        <div id="unity-footer">
                            <div id="unity-logo-title-footer"></div>
                            <div id="unity-fullscreen-button"></div>
                            <div id="unity-build-title">Night At RGU</div>
                        </div>
                        </div>
                    <script>
                   var canvas = document.querySelector("#unity-canvas");
                    function unityShowBanner(msg, type) {
                    var warningBanner = document.querySelector("#unity-warning");
                    function updateBannerVisibility() {
                    warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
                    }
                    var div = document.createElement('div');
        div.innerHTML = msg;
        warningBanner.appendChild(div);
        if (type == 'error') div.style = 'background: red; padding: 10px;';
        else {
          if (type == 'warning') div.style = 'background: yellow; padding: 10px;';
          setTimeout(function() {
            warningBanner.removeChild(div);
            updateBannerVisibility();
          }, 5000);
        }
        updateBannerVisibility();
      }

      var buildUrl = "Build";
      var loaderUrl = "Night At RGU - Build/Build/Night At RGU - Build.data";
      var config = {
        arguments: [],
        dataUrl: "Night At RGU - Build/Build/Night At RGU - Build.data",
        frameworkUrl: "Night At RGU - Build/Build/Night At RGU - Build.framework.js",
        codeUrl: "Night At RGU - Build/Build/Night At RGU - Build.wasm",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "DefaultCompany",
        productName: "Night At RGU",
        productVersion: "1.0",
        showBanner: unityShowBanner,
        // errorHandler: function(err, url, line) {
        //    alert("error " + err + " occurred at line " + line);
        //    // Return 'true' if you handled this error and don't want Unity
        //    // to process it further, 'false' otherwise.
        //    return true;
        // },
      };

 

      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        // Mobile device style: fill the whole browser client area with the game canvas:

        var meta = document.createElement('meta');
        meta.name = 'viewport';
        meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';
        document.getElementsByTagName('head')[0].appendChild(meta);
        document.querySelector("#unity-container").className = "unity-mobile";
        canvas.className = "unity-mobile";



      } else {
        // Desktop style: Render the game canvas in a window that can be maximized to fullscreen:
        canvas.style.width = "960px";
        canvas.style.height = "600px";
      }

      document.querySelector("#unity-loading-bar").style.display = "block";

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        createUnityInstance(canvas, config, (progress) => {
          document.querySelector("#unity-progress-bar-full").style.width = 100 * progress + "%";
              }).then((unityInstance) => {
                document.querySelector("#unity-loading-bar").style.display = "none";
                document.querySelector("#unity-fullscreen-button").onclick = () => {
                  unityInstance.SetFullscreen(1);
                };

              }).catch((message) => {
                alert(message);
              });
            };

      document.body.appendChild(script);

    </script>
                </div>
       
            </div>

            <!-- RIGHT SIDE -->
            <div class="side-bg"></div>
        </div>
        
        <!-- FOOTER -->
        <footer class="footer">
            <p class="footer-title">IceLink</p>
            <p class="footer-copy">© 2026 IceLink Inc. All rights reserved.</p>
        </footer>

        <script type="module">
            import { auth } from "./js/firebase.js";
            import { onAuthStateChanged } 
            from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
            const navImg = document.getElementById("nav-auth-img");
            const navLink = document.getElementById("nav-auth-link");
            onAuthStateChanged(auth, (user) => {
                if (user) {
                    // Logged in → show profile
                    navImg.src = "images/userProfile.png";
                    navImg.alt = "Profile";
                    navLink.href = "user-profile.html";
                } else {
                    // Not logged in → show login
                    navImg.src = "images/login.png";
                    navImg.alt = "Login";
                    navLink.href = "login.html";
                }
            });
        </script>
    </body>
</html>
