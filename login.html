<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IceLink Sign In</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/login.css">
  </head>
  <body>
    <header class="navbar full-width">
      <div class="nav-container">
        <div class="nav-left">
          <img src="images/IceLink_logo.png" alt="IceLink logo" style="height: 60px;">
        </div>
        <div class="nav-right">
          <a href="index.html"><img src="images/home.png" alt="Home"></a>
          <a href="games.html"><img src="images/games.png" alt="Games"></a>
          <a href="chat-rooms.html"><img src="images/chatroom.png" alt="Chat Rooms"></a>
          <a id="nav-auth-link" href="login.html">
            <img id="nav-auth-img" src="images/login.png" style="height: 60px;" alt="Login">
          </a>
        </div>
      </div>
    </header>

    <div class="page-wrapper">
      <div class="side-bg"></div>
      <div class="content-area">
        <div class="login-panel">
          <div class="login-card">
            <div class="logo-wrapper">
              <img src="images/IceLink_logo.png" alt="IceLink">
            </div>
            <h2>Sign in to IceLink</h2>
            <p>Access your groups, quizzes, and chat rooms in one place.</p>
            <form id="loginForm">
              <div>
                <label for="email">Email address</label>
                <input type="email" name="email" id="email" placeholder="name@example.com" autocomplete="email" required>
              </div>
              <div>
                <div class="field-header">
                  <label for="password">Password</label>
                  <a href="#">Forgot password?</a>
                </div>
                <input type="password" name="password" id="password" placeholder="Enter your password" autocomplete="current-password" required>
              </div>
              <button type="submit" id="signButton">Sign in</button>
            </form>
            <p class="signup-text">
              Not a member? <a href="register.html">Sign up here</a>
            </p>
          </div>
        </div>
      </div>
      <div class="side-bg"></div>
    </div>

    <footer class="footer">
      <p class="footer-title">IceLink</p>
      <p class="footer-copy"> 2026 IceLink Inc. All rights reserved.</p>
    </footer>

    <script type="module">
import { auth } from "./js/firebase.js";
import { signInWithEmailAndPassword } 
from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

const form = document.getElementById("loginForm");

form.addEventListener("submit", async (e) => {
  e.preventDefault();

  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;

  if (!email || !password) {
    alert("Please enter email and password");
    return;
  }

  try {
    const userCredential = await signInWithEmailAndPassword(auth, email, password);

    // TEMP: derive username from email (until database is used)
    const emailName = email.split("@")[0];
    localStorage.setItem("username", emailName);

    console.log("Logged in:", userCredential.user);

    alert("Login successful!");

    /* redirect to home */
    window.location.href = "user-profile.html";

  } catch (error) {
    alert(error.message);
  }
});
</script>

<script type="module">
    import { auth } from "./js/firebase.js";
    import { onAuthStateChanged } 
    from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
    const navImg = document.getElementById("nav-auth-img");
    const navLink = document.getElementById("nav-auth-link");
    onAuthStateChanged(auth, (user) => {
      if (user) {
        // Logged in → show profile
        navImg.src = "images/userProfile.png";
        navImg.alt = "Profile";
        navLink.href = "user-profile.html";
        } else {
          // Not logged in → show login
          navImg.src = "images/login.png";
          navImg.alt = "Login";
          navLink.href = "login.html";
        }
    });
  </script>

  </body>
</html>
