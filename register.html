<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IceLink Sign Up</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/register.css">
  </head>
  <body>
    <header class="navbar full-width">
      <div class="nav-container">
        <div class="nav-left">
          <img src="images/IceLink_logo.png" alt="IceLink logo" style="height: 60px;">
        </div>
        <div class="nav-right">
          <a href="index.html"><img src="images/home.png" alt="Home"></a>
          <a href="games.html"><img src="images/games.png" alt="Games"></a>
          <a href="chat-rooms.html"><img src="images/chatroom.png" alt="Chat Rooms"></a>
          <a id="nav-auth-link" href="login.html">
            <img id="nav-auth-img" src="images/login.png" style="height: 60px;" alt="Login">
          </a>
        </div>
      </div>
    </header>

    <div class="page-wrapper">
      <div class="side-bg"></div>
      <div class="content-area">
        <div class="register-panel">
          <div class="register-card">
            <div class="logo-wrapper">
              <img src="images/IceLink_logo.png" alt="IceLink">
            </div>
            <h2>Join IceLink</h2>
            <p>Create your account to connect with students and discover your personality.</p>
            <form id="registerForm">
              <div>
                <label for="name">Full Name</label>
                <input type="text" name="name" id="name" placeholder="Enter your full name" autocomplete="name" required>
              </div>
              <div>
                <label for="email">Email address</label>
                <input type="email" name="email" id="email" placeholder="name@example.com" autocomplete="email" required>
              </div>
              <div>
                <label for="password">Password</label>
                <input type="password" name="password" id="password" placeholder="Create a password" autocomplete="new-password" required>
              </div>
              <div>
                <label for="confirm-password">Confirm Password</label>
                <input type="password" name="confirm-password" id="confirm-password" placeholder="Confirm your password" autocomplete="new-password" required>
              </div>
              <div class="checkbox-wrapper">
                <input type="checkbox" name="terms" id="terms" required>
                <label for="terms">I agree to the <a href="#">Terms of Service</a> and <a href="#">Privacy Policy</a></label>
              </div>
              <button type="submit" id="registerButton">Sign up</button>
            </form>
            <p class="signin-text">
              Already have an account? <a href="login.html">Sign in here</a>
            </p>
          </div>
        </div>
      </div>
      <div class="side-bg"></div>
    </div>

    <footer class="footer">
      <p class="footer-title">IceLink</p>
      <p class="footer-copy"> 2026 IceLink Inc. All rights reserved.</p>
    </footer>

    <script type="module">
import { auth } from "./js/firebase.js";
import { createUserWithEmailAndPassword } 
from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

const form = document.getElementById("registerForm");

form.addEventListener("submit", async (e) => {
  e.preventDefault();

  const name = document.getElementById("name").value.trim();
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;
  const confirmPassword = document.getElementById("confirm-password").value;

  /* validation */
  if (!name || !email || !password || !confirmPassword) {
    alert("Please fill in all fields");
    return;
  }

  if (password !== confirmPassword) {
    alert("Passwords do not match");
    return;
  }

  try {
    const userCredential = await createUserWithEmailAndPassword(auth, email, password);

    console.log("User created:", userCredential.user);

    /* store username locally (used later in chat) */
    localStorage.setItem("username", name);

    /* redirect */
    window.location.href = "index.html";

  } catch (error) {
    alert(error.message);
  }
});
</script>

<script type="module">
    import { auth } from "./js/firebase.js";
    import { onAuthStateChanged } 
    from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
    const navImg = document.getElementById("nav-auth-img");
    const navLink = document.getElementById("nav-auth-link");
    onAuthStateChanged(auth, (user) => {
      if (user) {
        // Logged in → show profile
        navImg.src = "images/userProfile.png";
        navImg.alt = "Profile";
        navLink.href = "user-profile.html";
        } else {
          // Not logged in → show login
          navImg.src = "images/login.png";
          navImg.alt = "Login";
          navLink.href = "login.html";
        }
    });
  </script>

  </body>
</html>
