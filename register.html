<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IceLink Sign Up</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/register.css">
  </head>
  <body>
    <header class="navbar full-width">
      <div class="nav-container">
        <div class="nav-left">
          <img src="images/IceLink_logo.png" alt="IceLink logo" style="height: 60px;">
        </div>
        <div class="nav-right">
          <a href="index.html"><img src="images/home.png" alt="Home"></a>
          <a href="games.html"><img src="images/games.png" alt="Games"></a>
          <a href="chat-rooms.html"><img src="images/chatroom.png" alt="Chat Rooms"></a>
          <a href="login.html"><img src="images/login.png" alt="Login"></a>
        </div>
      </div>
    </header>

    <div class="page-wrapper">
      <div class="side-bg"></div>
      <div class="content-area">
        <div class="register-panel">
          <div class="register-card">
            <div class="logo-wrapper">
              <img src="images/IceLink_logo.png" alt="IceLink">
            </div>
            <h2>Join IceLink</h2>
            <p>Create your account to connect with students and discover your personality.</p>
            <form action="/register" method="POST">
              <div>
                <label for="name">Full Name</label>
                <input type="text" name="name" id="name" placeholder="Enter your full name" autocomplete="name" required>
              </div>
              <div>
                <label for="email">Email address</label>
                <input type="email" name="email" id="email" placeholder="name@example.com" autocomplete="email" required>
              </div>
              <div>
                <label for="password">Password</label>
                <input type="password" name="password" id="password" placeholder="Create a password" autocomplete="new-password" required>
              </div>
              <div>
                <label for="confirm-password">Confirm Password</label>
                <input type="password" name="confirm-password" id="confirm-password" placeholder="Confirm your password" autocomplete="new-password" required>
              </div>
              <div class="checkbox-wrapper">
                <input type="checkbox" name="terms" id="terms" required>
                <label for="terms">I agree to the <a href="#">Terms of Service</a> and <a href="#">Privacy Policy</a></label>
              </div>
              <button type="submit" id="registerButton">Sign up</button>
            </form>
            <p class="signin-text">
              Already have an account? <a href="login.html">Sign in here</a>
            </p>
          </div>
        </div>
      </div>
      <div class="side-bg"></div>
    </div>

    <footer class="footer">
      <p class="footer-title">IceLink</p>
      <p class="footer-copy"> 2026 IceLink Inc. All rights reserved.</p>
    </footer>
  </body>
</html>
