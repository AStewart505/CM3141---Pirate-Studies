<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>IceLink | Profile</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/user-profile.css">
</head>

<body>
    <!-- NAVBAR (same as index) -->
    <header class="navbar full-width">
        <div class="nav-container">
            <div class="nav-left">
                <img src="images/IceLink_logo.png" style="height: 60px;">
            </div>

            <div class="nav-right">
                <a href="index.html"><img src="images/home.png" style="height: 60px;"></a>
                <a href="games.html"><img src="images/games.png" style="height: 60px;"></a>
                <a href="chat-rooms.html"><img src="images/chatroom.png" style="height: 60px;"></a>
                <a href="login.html"><img src="images/login.png" style="height: 60px;"></a>
            </div>
        </div>
    </header>

    <div class="page-wrapper">

        <!-- LEFT -->
        <div class="side-bg"></div>

        <!-- CENTER -->
        <div class="content-area">

            <!-- VIDEO BACKGROUND (same as index) -->
            <video autoplay muted loop playsinline poster="images/video_fallback_image.png" class="bg-video">
                <source src="videos/Icelink_background.mp4" type="video/mp4">
            </video>

            <div class="video-overlay"></div>

            <!-- CONTENT -->
            <div class="page-content">

                <main class="profile-container">
                    <!-- LEFT PANEL -->
                    <div class="profile-left">

                        <div class="profile-banner"></div>
                        <div class="profile-main">
                            <img src="images/user_pfp.png" alt="User Avatar" class="avatar">
                            <h2 id="profile-name">Loading...</h2>
                            <p class="username" id="profile-username">@user</p>
                            <p class="badge">Explorer</p>
                            <p class="bio">
                                Finding your people shouldn't be difficult.
                            </p>

                            <div class="profile-buttons">
                                <button class="profile-btn">Edit Profile</button>
                                <button id="logout-btn" class="profile-btn logout-btn">Logout</button>
                                <button>⚙️</button>
                                <button>•••</button>
                            </div>
                            
                            <div class="profile-meta">
                                <p><strong>Member Since:</strong> Jan 2026</p>
                            </div>
                        </div>
                    </div>
                    
                    <!-- RIGHT PANEL -->
                    <div class="profile-right">
                        <div class="profile-tabs">
                            <span class="active">Activity</span>
                            <span>Games</span>
                            <span>Groups</span>
                        </div>
                        
                        <div class="profile-content">
                            <p class="empty-text">
                                No activity yet ❄️<br>
                                Start exploring to see your progress here.
                            </p>

                            <div class="profile-actions">
                                <button>Start Quiz</button>
                                <button>Explore Games</button>
                            </div>
                        </div>
                    </div>
                </main>
            </div>
        </div>

        <!-- RIGHT -->
        <div class="side-bg"></div>
    </div>

    <!-- FOOTER (same as index) -->
    <footer class="footer">
        <p class="footer-title">IceLink</p>
        <p class="footer-copy">© 2026 IceLink Inc. All rights reserved.</p>
    </footer>

    <script type="module">
        import { auth } from "./js/firebase.js";
        import { onAuthStateChanged } 
        from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

        // Logout functionality
        import { signOut } 
        from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
        const logoutBtn = document.getElementById("logout-btn");

        logoutBtn.addEventListener("click", async () => {
            try {
                await signOut(auth);
                localStorage.removeItem("username");
                // redirect after logout
                window.location.href = "index.html";
            } catch (error) {
                alert(error.message);
            }
        });

        /* elements */
        const nameEl = document.getElementById("profile-name");
        const usernameEl = document.getElementById("profile-username");
        const emailEl = document.getElementById("profile-email");

        onAuthStateChanged(auth, (user) => {
            if (user) {
                const username = localStorage.getItem("username") || "User";
                nameEl.textContent = username;
                usernameEl.textContent = "@" + username.toLowerCase().replace(/\s/g, "");
                emailEl.textContent = user.email;
            } else {
                /* not logged in → kick out */
                window.location.href = "login.html";
            }
        });
    </script>
</body>
</html>
